name: Build LX Book Draw
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LX-Book-Draw
          path: build/*.zip
