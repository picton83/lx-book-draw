name: Build LX Book Draw
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel   # the Apple Silicon machines were too busy; the app is still built for both kinds of Mac
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LX-Book-Draw
          path: build/*.zip
      # Every successful build becomes a release. The app updates itself from the newest one:
      # the number after "-b" in the tag is the build number it compares against.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)-b${GITHUB_RUN_NUMBER}"
          # the Windows job may have made the release already
          gh release create "$TAG" build/*.zip --title "LX Book Draw $(cat VERSION) (build ${GITHUB_RUN_NUMBER})" --notes-file RELEASE_NOTES.md \
            || gh release upload "$TAG" build/*.zip --clobber

  # The Windows app (windows/LXBookDraw.Windows): built alongside the Mac app and added to the same release as a single .exe.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the Windows app
        run: |
          VER="$(cat VERSION | tr -d '\r\n')"
          dotnet publish windows/LXBookDraw.Windows/LXBookDraw.Windows.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:InformationalVersion="$VER" -p:BuildNumber="${GITHUB_RUN_NUMBER}" -o out
          mkdir -p dist
          cp "out/LX Book Draw.exe" "dist/LX-Book-Draw-Windows-${VER}.exe"
      # The app updates itself by comparing build numbers, so make sure this one carries its own
      - name: Check the build number is inside the app
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse "windows/LXBookDraw.Windows/obj/Release" -Filter "LX Book Draw.dll" | Select-Object -First 1
          $asm = [System.Reflection.Assembly]::LoadFile($dll.FullName)
          $build = ($asm.GetCustomAttributesData() | Where-Object { $_.AttributeType.Name -eq 'AssemblyMetadataAttribute' -and $_.ConstructorArguments[0].Value -eq 'Build' }).ConstructorArguments[1].Value
          Write-Host "Build inside the app: $build"
          if ("$build" -ne "$env:GITHUB_RUN_NUMBER") { throw "The app's build number ($build) isn't $env:GITHUB_RUN_NUMBER" }
      # The installer: puts the app in Program Files with a Start menu entry and an uninstaller
      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $env:APPVER = (Get-Content VERSION -Raw).Trim()
          & $iscc windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "The installer wasn't made" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: LX-Book-Draw-Windows
          path: dist/*.exe
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(cat VERSION | tr -d '\r\n')"
          TAG="v${VER}-b${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.exe --title "LX Book Draw ${VER} (build ${GITHUB_RUN_NUMBER})" --notes-file RELEASE_NOTES.md \
            || gh release upload "$TAG" dist/*.exe --clobber
